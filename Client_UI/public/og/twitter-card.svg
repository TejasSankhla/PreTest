<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- Subtle accent border -->
  <rect x="0" y="0" width="1200" height="8" fill="#f97316"/>

  <!-- Logo (centered-left area) -->
  <g transform="translate(120, 180)">
    <!-- Outer circle -->
    <circle cx="80" cy="80" r="72" stroke="#f97316" stroke-width="5" fill="none"/>
    <!-- Middle circle -->
    <circle cx="80" cy="80" r="48" stroke="#f97316" stroke-width="5" fill="none"/>
    <!-- Center bullseye -->
    <circle cx="80" cy="80" r="24" fill="#f97316"/>
    <!-- Arrow -->
    <path d="M24 24 L80 80" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M80 80 L72 64 M80 80 L64 72" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Content -->
  <g transform="translate(400, 210)">
    <!-- Brand Name -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="700" fill="#111827" letter-spacing="-0.02em">
      PreTest
    </text>

    <!-- Tagline -->
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="500" fill="#6b7280" letter-spacing="-0.01em">
      Master your next interview
    </text>

    <!-- Sub-tagline -->
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#9ca3af">
      Practice with recent grads from top companies
    </text>
  </g>

  <!-- Footer accent -->
  <rect x="0" y="592" width="1200" height="8" fill="#f97316"/>
</svg>
