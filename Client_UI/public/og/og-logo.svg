<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#ffffff"/>

  <!-- Logo (centered) -->
  <g transform="translate(200, 200)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="144" stroke="#f97316" stroke-width="8" fill="none"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="96" stroke="#f97316" stroke-width="8" fill="none"/>
    <!-- Center bullseye -->
    <circle cx="0" cy="0" r="48" fill="#f97316"/>
    <!-- Arrow -->
    <path d="M-96 -96 L0 0" stroke="#111827" stroke-width="12" stroke-linecap="round"/>
    <path d="M0 0 L-16 -32 M0 0 L-32 -16" stroke="#111827" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
